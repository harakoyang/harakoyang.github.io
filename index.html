<!DOCTYPE html>
<html lang="zh-Hant"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>圖片預覽 · 天体観測「Tentai Kansoku」Catalogue</title>
<meta name="description" content="天体観測 Catalogue 收錄的深空天體縮略圖一覽">
<link rel="canonical" href="https://harako.cc.cd/">
<style>
  :root {
    --bg: #04081a;
    --panel: rgba(16, 27, 61, 0.62);
    --line: rgba(140, 170, 230, 0.18);
    --line-strong: rgba(140, 170, 230, 0.42);
    --text: #e8eeff;
    --muted: #93a4cc;
    --ok: #6ec1ff;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    padding: clamp(24px, 5vw, 56px);
    background:
      radial-gradient(1200px 600px at 15% -5%, #16224d 0%, transparent 60%),
      radial-gradient(900px 500px at 90% 10%, #1b1840 0%, transparent 55%),
      var(--bg);
    color: var(--text);
    font-family: "PingFang TC", "Microsoft JhengHei", "Noto Sans TC",
                 "PingFang SC", "Microsoft YaHei",
                 "Hiragino Sans", "Yu Gothic", "Noto Sans JP",
                 system-ui, -apple-system, Segoe UI, sans-serif;
    line-height: 1.7;
    -webkit-font-smoothing: antialiased;
  }

  .wrap { max-width: 1280px; margin: 0 auto; }

  h1 { margin: 0 0 10px; font-size: clamp(22px, 3.4vw, 32px); }
  h1 .romaji { color: var(--muted); font-weight: 400; }

  .lede { margin: 0 0 8px; color: var(--muted); font-size: 14.5px; }
  .lede a { color: var(--ok); }

  .count { margin: 0 0 26px; color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
    gap: 14px;
  }

  .card {
    display: block;
    padding: 8px;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 12px;
    color: inherit;
    text-decoration: none;
    transition: border-color .15s, background .15s;
  }
  @media (hover: hover) {
    .card:hover { border-color: var(--line-strong); background: rgba(140, 170, 230, 0.12); }
  }

  /* 固定卡片內的圖框比例，縮略圖長寬不一時版面才不會參差。 */
  .card img {
    display: block;
    width: 100%;
    aspect-ratio: 4 / 3;
    object-fit: cover;
    background: #0a1330;
    border-radius: 8px;
  }

  .name { margin: 8px 2px 2px; font-size: 13.5px; font-weight: 600; }
  .label { margin: 0 2px; color: var(--muted); font-size: 12px; }

  .empty { color: var(--muted); }

  footer { margin-top: 40px; color: var(--muted); font-size: 12.5px; }
</style>
</head>
<body>
<div class="wrap">

  <h1>圖片預覽<span class="romaji"> · 天体観測「Tentai Kansoku」Catalogue</span></h1>
  <p class="lede">本頁只是倉庫內縮略圖的一覽。完整的篩選、排序與觀測條件請至 <a href="https://harako.cc.cd/">harako.cc.cd</a>。</p>
  <p class="count" id="count"></p>

  <div class="grid" id="grid"></div>

  <footer>圖片版權屬各原始來源，點擊卡片可查看原圖。</footer>

</div>

<script src="public/assets/catalogue.js"></script>
<script>
(function () {
  "use strict";

  var grid = document.getElementById("grid");
  var count = document.getElementById("count");
  var data = window.CATALOGUE;

  if (!data || !data.objects) {
    count.className = "empty";
    count.textContent = "目錄資料載入失敗。";
    return;
  }

  function esc(s) {
    return String(s).replace(/[&<>"]/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c];
    });
  }

  // 目錄裡的路徑是相對 public/ 寫的（網站本體就部署在那一層），而 GitHub Pages
  // 從倉庫根目錄供檔案，所以這裡要補回 public/ 前綴。
  function asset(p) { return "public/" + p; }

  var items = data.objects.filter(function (o) { return o.img && o.img.thumb; });

  count.textContent = "共 " + items.length + " 張";

  grid.innerHTML = items.map(function (o) {
    // 少數天體沒有星表編號（面紗星雲、衣架星團等），改拿別名當標題，
    // 否則卡片會缺一行粗體標題只剩灰色小字。
    var ids = o.ids.join(" ");
    var name = ids || o.label;
    var label = ids ? o.label : "";

    return '<a class="card" href="' + esc(asset(o.img.full)) + '" target="_blank" rel="noopener noreferrer">' +
      '<img src="' + esc(asset(o.img.thumb)) + '" alt="' + esc(name + (label ? " " + label : "")) +
      '" loading="lazy" decoding="async">' +
      '<div class="name">' + esc(name) + "</div>" +
      (label ? '<div class="label">' + esc(label) + "</div>" : "") +
      "</a>";
  }).join("");
})();
</script>
</body></html>
