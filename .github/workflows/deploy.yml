# push main 部署生产 Pages（harako-site.pages.dev，自订网域 harako.cc.cd）。
# push dev 部署预发（dev.harako-site.pages.dev，自订网域 dev.harako.cc.cd）。
# 两套环境各自挂独立的 KV 与 D1，见 wrangler.jsonc 的 env.preview。
#
# 需要在 GitHub 仓库 Settings → Secrets and variables → Actions 配置：
#   CLOUDFLARE_API_TOKEN  — Account.Cloudflare Pages:Edit，外加 D1:Edit 与 Workers KV Storage:Edit
#   CLOUDFLARE_ACCOUNT_ID — Cloudflare 控制台右侧 / Workers & Pages 概览可见
#
# OAuth 与企微 webhook 是 Pages secret，不在这个流程里，Worker 上的旧值也不会跟着过来。
# 生产和预发各写一次：
#   npx wrangler pages secret put GITHUB_CLIENT_ID --project-name harako-site
#   npx wrangler pages secret put GITHUB_CLIENT_ID --project-name harako-site --env preview
# 同样处理 GITHUB_CLIENT_SECRET、GOOGLE_CLIENT_ID、GOOGLE_CLIENT_SECRET、WECOM_WEBHOOK_URL。
name: Deploy

on:
  push:
    branches: [main, dev]

# 按分支分组：预发的部署不该把正在跑的生产部署取消掉。
concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # checkout 在 Actions 里是 detached HEAD，wrangler 推断不出分支，必须显式传入。
      # main 是 Pages 的生产分支，其余分支（这里是 dev）走 preview 配置。
      - name: Resolve target
        id: target
        run: |
          if [ "${{ github.ref_name }}" = "main" ]; then
            echo "args=" >> "$GITHUB_OUTPUT"
            echo "db=harako" >> "$GITHUB_OUTPUT"
            echo "branch=main" >> "$GITHUB_OUTPUT"
          else
            echo "args=--env preview" >> "$GITHUB_OUTPUT"
            echo "db=harako-dev" >> "$GITHUB_OUTPUT"
            echo "branch=dev" >> "$GITHUB_OUTPUT"
          fi

      # 项目不存在时创建，并把生产分支固定成 main。
      # 不先创建的话，第一次如果从 dev 部署，wrangler 可能把 dev 当成生产分支。
      - name: Ensure Pages project
        run: |
          python - <<'PY'
          import json, subprocess, sys
          raw = subprocess.check_output(
              ["npx", "wrangler", "pages", "project", "list", "--json"],
              text=True,
          )
          projects = json.loads(raw[raw.find("[") :])
          if any(p.get("Project Name") == "harako-site" for p in projects):
              print("Pages project harako-site already exists")
              sys.exit(0)
          subprocess.check_call(
              ["npx", "wrangler", "pages", "project", "create", "harako-site", "--production-branch", "main"]
          )
          PY
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # 迁移排在部署前面：新代码可能依赖新的表结构，反过来会有一小段时间
      # 线上代码查不到栏位。D1 迁移不可回滚，加迁移档时要特别确认。
      - name: Apply D1 migrations
        run: npx wrangler d1 migrations apply ${{ steps.target.outputs.db }} --remote ${{ steps.target.outputs.args }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy
        run: npx wrangler pages deploy --branch ${{ steps.target.outputs.branch }} --commit-hash ${{ github.sha }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
